name: Coletor ANBIMA

on:
  schedule:
    # 23:00 UTC = 20:00 em Brasília, segunda a sexta. Repete às 02:00 UTC como segunda tentativa.
    - cron: "0 23 * * 1-5"
    - cron: "0 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor-anbima
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Coletar debêntures
        run: python coletor/anbima_debentures.py

      - name: Coletar títulos públicos
        run: python coletor/anbima_titulos_publicos.py

      - name: Coletar curva zero-cupom (ETTJ)
        run: python coletor/anbima_ettj.py

      - name: Coletar IPCA mensal (BCB)
        continue-on-error: true
        run: python coletor/bcb_ipca.py

      - name: Classificar universo por segmento (energia, saneamento, transporte)
        continue-on-error: true
        run: python analises/universo_amplo.py

      - name: Atualizar características e agenda (SND)
        continue-on-error: true
        run: python coletor/snd_debentures.py

      - name: Atualizar universo e grupos de risco (SND + CVM)
        continue-on-error: true
        run: python analises/universo_grupos.py

      - name: Negócios do secundário (SND)
        continue-on-error: true
        run: python coletor/snd_negocios.py 30

      - name: Contratos de concessão (ANEEL)
        continue-on-error: true
        run: python coletor/aneel_concessoes.py

      - name: Balanços CVM (DFP) e CRI/CRA (CVM), semanal às segundas
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f dados/cvm/fundamentos.csv ]; then
            python coletor/cvm_dfp.py
            python coletor/cvm_cri_cra.py
          fi

      - name: Documentos, notícias e análises por emissor
        continue-on-error: true
        run: python coletor/documentos.py

      - name: Classificar documentos novos (JEV)
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python analises/jev_classificar.py tudo

      - name: Precificar universo
        run: python analises/precificacao.py

      - name: Spread justo e desvio em relação aos pares
        run: |
          pip install --quiet numpy
          python analises/spread_justo.py

      - name: Atributos de comparabilidade e pares (JEV refina a fase)
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python analises/atributos_emissor.py
          python analises/pares.py

      - name: Gerar site
        run: python site/gerar.py

      - name: Salvar no repositório
        run: |
          git config user.name "coletor-anbima[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/ site/public/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "dados: ANBIMA $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs
            git push
          fi

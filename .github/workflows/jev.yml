name: JEV (classificação de documentos)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "testar | validar | comparar | tudo | atributos"
        required: true
        default: testar

permissions:
  contents: write

jobs:
  jev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Rodar JEV
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          pip install --quiet openpyxl
          if [ "${{ inputs.modo }}" = "atributos" ]; then python analises/atributos_emissor.py && python analises/pares.py; else python analises/jev_classificar.py ${{ inputs.modo }}; fi

      - name: Salvar respostas
        if: inputs.modo != 'testar'
        run: |
          git config user.name "jev[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/derivados/
          git diff --cached --quiet || (git commit -m "dados: JEV ${{ inputs.modo }}" && git push)
